[project]
name = "aye_finance_hr_bot_v2"
version = "0.1.0"
description = "aye-finance-hr-bot-v2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
kickoff = "aye_finance_hr_bot_v2.main:kickoff"
run_crew = "aye_finance_hr_bot_v2.main:kickoff"
plot = "aye_finance_hr_bot_v2.main:plot"
run_with_trigger = "aye_finance_hr_bot_v2.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
